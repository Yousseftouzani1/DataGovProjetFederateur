# ============================================
# DataGov - Complete Microservices Stack
# With HDP Integration (Atlas + Ranger)
# ============================================

services:
  # INFRASTRUCTURE: Database (MongoDB)
  mongo:
    image: mongo:7.0
    container_name: datagov-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - datagov-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # INFRASTRUCTURE: Orchestration (Airflow)
  airflow:
    image: apache/airflow:2.7.1
    container_name: datagov-airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__RBAC=True
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/datasets:/opt/airflow/datasets
    command: standalone
    networks:
      - datagov-network
    restart: unless-stopped

  # INFRASTRUCTURE: Apache Atlas (Metadata Governance)
  apache-atlas:
    image: sburn/apache-atlas
    container_name: apache-atlas
    ports:
      - "21000:21000"
    volumes:
      - atlas_data:/apache-atlas/data
    networks:
      - datagov-network
    restart: unless-stopped
    mem_limit: 3g
    environment:
      - ATLAS_SERVER_HEAP=-Xms1024m -Xmx2048m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:21000/api/atlas/v2/types/typedefs"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s

  # INFRASTRUCTURE: Apache Ranger Database (PostgreSQL)
  ranger-postgres:
    image: postgres:15-alpine
    container_name: ranger-postgres
    environment:
      POSTGRES_DB: ranger
      POSTGRES_USER: rangeradmin
      POSTGRES_PASSWORD: rangerR0cks!
    volumes:
      - ranger_pg_data:/var/lib/postgresql/data
    networks:
      - datagov-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rangeradmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INFRASTRUCTURE: Apache Ranger Admin (Authorization)
  ranger-admin:
    image: odpi/apache-ranger-admin:latest
    container_name: ranger-admin
    environment:
      - PGHOST=ranger-postgres
      - PGUSER=rangeradmin
      - PGPASSWORD=rangerR0cks!
      - RANGER_PASSWORD=rangerR0cks!
    ports:
      - "6080:6080"
    depends_on:
      ranger-postgres:
        condition: service_healthy
    networks:
      - datagov-network
    restart: unless-stopped

  # SERVICE 1: Authentication (Port 8001)
  auth-service:
    build: ./services/auth-serv
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - mongo
    networks:
      - datagov-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 2: Taxonomie PII/SPI (Port 8002)
  taxonomie-service:
    build: ./services/taxonomie-serv
    container_name: taxonomie-service
    env_file:
      - .env
    ports:
      - "8002:8002"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/taxonomie-serv/backend:/app/backend
      - ./services/common:/common
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 3: Presidio Detection (Port 8003)
  presidio-service:
    build: ./services/presidio-serv
    container_name: presidio-service
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/presidio-serv:/app
      - ./services/common:/common
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 4: Data Cleaning (Port 8004)
  cleaning-service:
    build: ./services/cleaning-serv
    container_name: cleaning-service
    env_file:
      - .env
    ports:
      - "8004:8004"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/common:/common
      - ./services/cleaning-serv/storage:/app/storage
      - ./atlas_integration:/app/atlas_integration
      - ./ranger_integration:/app/ranger_integration
      - ./airflow/datasets:/opt/airflow/datasets # Shared volume for exports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 5: ML Classification (Port 8005)
  classification-service:
    build: ./services/classification-serv
    container_name: classification-service
    env_file:
      - .env
    ports:
      - "8005:8005"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/common:/common
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 6: Correction (Port 8006)
  correction-service:
    build: ./services/correction-serv
    container_name: correction-service
    env_file:
      - .env
    ports:
      - "8006:8006"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/common:/common
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 7: Annotation (Port 8007)
  annotation-service:
    build: ./services/annotation-serv
    container_name: annotation-service
    env_file:
      - .env
    ports:
      - "8007:8007"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/common:/common
      - ./airflow/datasets:/opt/airflow/datasets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 8: Quality ISO 25012 (Port 8008)
  quality-service:
    build: ./services/quality-serv
    container_name: quality-service
    env_file:
      - .env
    environment:
      - CLEANING_SERVICE_URL=http://cleaning-service:8004
    ports:
      - "8008:8008"
    depends_on:
      - mongo
    networks:
      - datagov-network
    volumes:
      - ./services/common:/common
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SERVICE 9: EthiMask (Port 8009)
  ethimask-service:
    build: ./services/ethimask-serv
    container_name: ethimask-service
    env_file:
      - .env
    ports:
      - "8009:8009"
    volumes:
      - ./services/ethimask-serv:/app
      - ./services/common:/common
    depends_on:
      - mongo
    networks:
      - datagov-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MODERN FRONTEND: DataGov (Port 3000)
  datagov-modern:
    build: ./frontend-react
    container_name: datagov-modern
    ports:
      - "3000:80"
    networks:
      - datagov-network
    restart: unless-stopped

  # NGINX GATEWAY (Port 8000)
  nginx-gateway:
    image: nginx:1.25-alpine
    container_name: nginx-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - taxonomie-service
      - cleaning-service
      - annotation-service
      - datagov-modern
    networks:
      - datagov-network
    restart: unless-stopped

# NETWORK & VOLUMES
networks:
  datagov-network:
    driver: bridge

volumes:
  mongo_data:
  atlas_data:
  ranger_pg_data:
